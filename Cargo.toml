[workspace]
resolver = "2"
members = [
    "crates/3dam-api",
    "crates/3dam-store",
    "crates/3dam-media",
    "crates/3dam-sources",
    "crates/3dam-render",
    "crates/3dam-viewer",
    "crates/3dam-core",
    "crates/3dam-client",
    "crates/3dam-server",
    "crates/3dam-frontend",
    "crates/3dam-desktop",
    "crates/3dam-cli",
    "crates/3dam",
    "xtask",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/krazyjakee/3DAM"
# Rust 1.91 is the workspace's supported floor. The locked dependency tree currently declares
# requirements up to Rust 1.89; rusqlite stays on the 0.39 line because 0.40 pulls in
# libsqlite3-sys 0.38, whose build script uses `std::cfg_select!` (stable only since Rust 1.95).
# The MSRV CI job checks this exact floor. Keep CLAUDE.md / README.md in sync when it changes.
rust-version = "1.91"

# One place for third-party versions; crates opt in with `dep.workspace = true`.
[workspace.dependencies]
# internal crates. Package names use the `dam-` prefix (cargo forbids a leading digit),
# so libs import as `dam_api`, `dam_core`, … exactly as the tech-spec pseudocode writes them.
# Directories keep the branded `3dam-` names; the shipped binary target is `3dam`.
dam-api = { path = "crates/3dam-api" }
dam-store = { path = "crates/3dam-store" }
dam-media = { path = "crates/3dam-media" }
# default-features off here so light consumers (the store) skip the SFTP/SMB network stack; the
# engine (dam-core) opts the backends back in via `features = ["sftp", "smb"]`.
dam-sources = { path = "crates/3dam-sources", default-features = false }
dam-render = { path = "crates/3dam-render" }
dam-viewer = { path = "crates/3dam-viewer" }
dam-core = { path = "crates/3dam-core" }
dam-client = { path = "crates/3dam-client" }
dam-server = { path = "crates/3dam-server" }
dam-frontend = { path = "crates/3dam-frontend" }
dam-desktop = { path = "crates/3dam-desktop" }
dam-cli = { path = "crates/3dam-cli" }

# async / runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "signal", "time", "io-std", "io-util"] }
tokio-stream = { version = "0.1", features = ["sync"] }
async-trait = "0.1"
futures = "0.3"

# serde / data
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
uuid = { version = "1", features = ["v7", "serde"] }
blake3 = "1"
bytes = "1"

# storage
# rusqlite 0.40 requires libsqlite3-sys 0.38, which does not build on the workspace MSRV because
# it uses `std::cfg_select!`; stay on the compatible 0.39/0.37 pair until the MSRV reaches 1.95.
rusqlite = { version = "0.39", features = ["backup", "bundled"] }
# argon2id password hashing for user accounts (phase 6, issue #42; ADR 0009 §4). API-token secrets
# stay on blake3 (high-entropy keys need no KDF); argon2 is for low-entropy user passwords only.
argon2 = "0.5"
base64 = "0.22"

# http / server / client
axum = { version = "0.8", features = ["ws"] }
# In-process TLS termination for a headless/hosted deployment (issue #75): serve HTTPS from a
# cert/key so exposing the server needs no `--insecure`. rustls backend (matches reqwest's).
axum-server = { version = "0.7", features = ["tls-rustls"] }
# Direct handle on rustls only to install the ring crypto provider for axum-server's TLS (issue #75).
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "set-header"] }
# `stream` is what lets an upload body be a file handle rather than a `Vec<u8>` (issue #80): the
# connected backend must not have to hold a multi-gigabyte asset in memory to forward it.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
# OIDC/OAuth2 login (phase 6, issue #41). Deliberately a library, not hand-rolled: the security of
# this flow is entirely in the details it owns — ID-token signature verification against a rotating
# JWKS, `iss`/`aud`/`exp` checks, and the nonce/PKCE bindings that stop code interception and
# replay. Its default features are `reqwest` + `rustls-tls`, which is already this workspace's HTTP
# and TLS posture, so it adds a dependency tree rather than a second one.
openidconnect = "4"
url = "2"
# web-client embedding (tech-spec 09 §A.4): bake web/dist into the binary, MIME by extension.
rust-embed = { version = "8", features = ["mime-guess"] }

# cli
clap = { version = "4", features = ["derive"] }
# Shell completions + man pages, generated from the live clap tree (ADR 0009 §10). Kept as runtime
# deps of `dam-cli` rather than a build script so the command tree stays the single source of truth:
# `3dam completions <shell>` / `3dam man` render from the same `Command` the parser uses.
clap_complete = "4"
clap_mangen = "0.3"
# serve config file (tech-spec 09 §A.1): TOML is the documented default; the loader is serde-driven.
toml = "0.8"

# fs / platform
walkdir = "2"
directories = "5"
# Native OS credential stores for outbound source credentials. Platform features are selected by
# dam-core so a production build never falls back to keyring's in-memory mock backend.
keyring = { version = "3.6.3", default-features = false }
# temp files for materialising remote-source bytes to a local path the (path-based) media
# handlers can read (tech-spec 07 §2); suffixed with the logical extension so detection holds.
tempfile = "3"
# Capability-relative filesystem access for local sources. Holding the registered root open and
# resolving every entry beneath that handle closes symlink-swap races which path canonicalisation
# cannot close (issue #124).
cap-std = "4"
cap-primitives = "4"
# `faccessat` for the upload destination-writability probe (issue #80). Asking the kernel whether a
# write *would* succeed is the only check that both sees mount flags/ownership and touches nothing —
# and touching the source root is what makes a watcher rescan it.
libc = "0.2"
# local-FS change notification for watch/auto-rescan (tech-spec 07 §3.1). Debounced → delta scan.
notify = "7"

# network file sources (tech-spec 07 §3.2–§3.3). SFTP via russh (pure-Rust async SSH) + its SFTP
# subsystem; SMB2/3 via the pure-Rust `smb` crate. russh is pinned to 0.51: newer russh wants
# crypto-bigint 0.7.5 while `smb`'s `sspi` pins the =0.7.0-rc.8 prerelease, and the two cannot be
# unified — 0.51 resolves cleanly alongside `smb`. Bump both together, deliberately.
russh = "0.51"
russh-sftp = "2"
smb = "0.11"

# CSV manifest export (tech-spec, phase 4 Reach — export/manifests).
csv = "1"

# render / gpu (wgpu pinned exactly — it breaks across minors; bump deliberately, tech-spec 06 §2).
# Consumed by the `wasm32` viewer islands now (tech-spec 09 §B.3) and by `dam-render` later (ADR 0002).
wgpu = "=30.0.0"
glam = "0.30"
bytemuck = { version = "1", features = ["derive"] }
# block_on the wgpu adapter/device init from the synchronous render path (dam-render runs inside
# spawn_blocking, no async runtime of its own). Same executor the headless-render spike validated.
pollster = "0.4"
gltf = { version = "1", default-features = false, features = ["import", "utils", "names"] }
# Assimp bindings (maintained -ng fork) — the import backend for the full 3D format range with
# materials/textures. `static-link` builds assimp from source and links it statically (ADR 0011).
russimp-ng = { version = "3.2", default-features = false }

# wasm viewer islands (browser-only; see crates/3dam-viewer). Kept out of the native build via
# per-target deps so `cargo build --workspace` stays a stub on non-wasm hosts.
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"
console_error_panic_hook = "0.1"
console_log = "1"
log = "0.4"

# media decode / encode (tech-spec 04 handlers + 08 convert). Pure-Rust where possible.
# `image` covers the v1 raster matrix (ADR 0009 §8); DDS/KTX2/EXR/HDR stage later.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tga", "tiff", "webp"] }
# GPU texture containers (issue #49). Deliberately NOT `image`'s own `dds` feature: that decoder
# handles only DXT1/3/5 and returns Unsupported for BC4/BC5/BC6H/BC7 — i.e. exactly the formats a
# real game-asset folder is full of (BC5 normal maps, BC7 albedo). The `dds` crate (image-rs org,
# safe Rust) decodes 81 formats including all of BCn, and reads the header without touching pixels,
# which is what the cheap tier needs. `rayon` is encode-only, so it is off.
dds = { version = "0.2", default-features = false }
# KTX2 container only — header, level index, DFD. It deliberately does not decompress payloads, so
# it is always safe to run at the cheap tier whatever the file carries.
ktx2 = "0.5"
# Block-compressed payload → pixels, for the KTX2 levels that are plain BCn/ASTC rather than
# Basis-supercompressed. Note its output is BGRA-packed u32, not RGBA.
texture2ddecoder = "0.1"
# `symphonia` is the audio decode/probe path (tech-spec 04 §7.1); curated to the v1 codec set.
symphonia = { version = "0.5", default-features = false, features = ["mp3", "flac", "vorbis", "ogg", "wav", "pcm", "adpcm", "isomp4", "aac", "aiff"] }
# WAV/PCM encode for the convert pipeline (tech-spec 08 §3.1).
hound = "3"
# Pure-Rust FFT for the EXPENSIVE-tier audio feature extractor (spectral flux / chroma, tech-spec 05
# §4.2). No system deps — keeps the default build model-free and offline (ADR 0006).
rustfft = "6"

# document handlers (PRODUCT_SPEC §9 phase 2b). All pure-Rust and all already in the tree
# transitively except `lopdf` — no native deps, matching the reasoning in ADR 0015 that kept video
# decode out of our build. Video needs no crate at all: it shells out to a discovered ffmpeg.
# PDF page count + text extraction. `default-features = false` drops the date/rayon stack we never
# touch — we only ever read an existing document, never author one. Pinned to 0.36: lopdf ≥0.40
# depends on md-5 0.11 → digest 0.11, which cannot unify with the digest 0.10 that `smb`'s crypto
# stack pins (the same class of conflict documented on `russh` above). Bump with `smb`, deliberately.
lopdf = { version = "0.36", default-features = false }
# DOCX/ODT are ZIP containers of XML; `zip` opens them and `quick-xml` streams the text runs out.
zip = { version = "6", default-features = false, features = ["deflate"] }
quick-xml = "0.38"
# Plaintext encoding detection (UTF-8/UTF-16/legacy single-byte) with BOM sniffing.
encoding_rs = "0.8"

# diagnostics
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
