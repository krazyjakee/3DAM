[workspace]
resolver = "2"
members = [
    "crates/3dam-api",
    "crates/3dam-store",
    "crates/3dam-media",
    "crates/3dam-sources",
    "crates/3dam-render",
    "crates/3dam-viewer",
    "crates/3dam-core",
    "crates/3dam-client",
    "crates/3dam-server",
    "crates/3dam-frontend",
    "crates/3dam-desktop",
    "crates/3dam-cli",
    "crates/3dam",
    "xtask",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/krazyjakee/3DAM"
# MSRV floor is set by the locked dependency tree, not our own source: libsqlite3-sys
# 0.38's build.rs uses the `cfg_select!` macro (stable since 1.91), and image 0.25 / wgpu 30
# / naga 30 declare 1.87–1.88. Setting this makes `cargo build` fail fast with a clear
# message on older toolchains instead of a cryptic `cfg_select` error. Bump only after
# rebuilding to confirm the new floor; keep CLAUDE.md / README.md in sync.
rust-version = "1.91"

# One place for third-party versions; crates opt in with `dep.workspace = true`.
[workspace.dependencies]
# internal crates. Package names use the `dam-` prefix (cargo forbids a leading digit),
# so libs import as `dam_api`, `dam_core`, … exactly as the tech-spec pseudocode writes them.
# Directories keep the branded `3dam-` names; the shipped binary target is `3dam`.
dam-api = { path = "crates/3dam-api" }
dam-store = { path = "crates/3dam-store" }
dam-media = { path = "crates/3dam-media" }
# default-features off here so light consumers (the store) skip the SFTP/SMB network stack; the
# engine (dam-core) opts the backends back in via `features = ["sftp", "smb"]`.
dam-sources = { path = "crates/3dam-sources", default-features = false }
dam-render = { path = "crates/3dam-render" }
dam-viewer = { path = "crates/3dam-viewer" }
dam-core = { path = "crates/3dam-core" }
dam-client = { path = "crates/3dam-client" }
dam-server = { path = "crates/3dam-server" }
dam-frontend = { path = "crates/3dam-frontend" }
dam-desktop = { path = "crates/3dam-desktop" }
dam-cli = { path = "crates/3dam-cli" }

# async / runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "signal", "time", "io-std", "io-util"] }
tokio-stream = { version = "0.1", features = ["sync"] }
async-trait = "0.1"
futures = "0.3"

# serde / data
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
uuid = { version = "1", features = ["v7", "serde"] }
blake3 = "1"
bytes = "1"

# storage
rusqlite = { version = "0.40", features = ["bundled"] }

# http / server / client
axum = { version = "0.8", features = ["ws"] }
# In-process TLS termination for a headless/hosted deployment (issue #75): serve HTTPS from a
# cert/key so exposing the server needs no `--insecure`. rustls backend (matches reqwest's).
axum-server = { version = "0.7", features = ["tls-rustls"] }
# Direct handle on rustls only to install the ring crypto provider for axum-server's TLS (issue #75).
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "set-header"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2"
# web-client embedding (tech-spec 09 §A.4): bake web/dist into the binary, MIME by extension.
rust-embed = { version = "8", features = ["mime-guess"] }

# cli
clap = { version = "4", features = ["derive"] }
# serve config file (tech-spec 09 §A.1): TOML is the documented default; the loader is serde-driven.
toml = "0.8"

# fs / platform
walkdir = "2"
directories = "5"
# temp files for materialising remote-source bytes to a local path the (path-based) media
# handlers can read (tech-spec 07 §2); suffixed with the logical extension so detection holds.
tempfile = "3"
# local-FS change notification for watch/auto-rescan (tech-spec 07 §3.1). Debounced → delta scan.
notify = "7"

# network file sources (tech-spec 07 §3.2–§3.3). SFTP via russh (pure-Rust async SSH) + its SFTP
# subsystem; SMB2/3 via the pure-Rust `smb` crate. russh is pinned to 0.51: newer russh wants
# crypto-bigint 0.7.5 while `smb`'s `sspi` pins the =0.7.0-rc.8 prerelease, and the two cannot be
# unified — 0.51 resolves cleanly alongside `smb`. Bump both together, deliberately.
russh = "0.51"
russh-sftp = "2"
smb = "0.11"

# CSV manifest export (tech-spec, phase 4 Reach — export/manifests).
csv = "1"

# render / gpu (wgpu pinned exactly — it breaks across minors; bump deliberately, tech-spec 06 §2).
# Consumed by the `wasm32` viewer islands now (tech-spec 09 §B.3) and by `dam-render` later (ADR 0002).
wgpu = "=30.0.0"
glam = "0.30"
bytemuck = { version = "1", features = ["derive"] }
# block_on the wgpu adapter/device init from the synchronous render path (dam-render runs inside
# spawn_blocking, no async runtime of its own). Same executor the headless-render spike validated.
pollster = "0.4"
gltf = { version = "1", default-features = false, features = ["import", "utils", "names"] }
# Assimp bindings (maintained -ng fork) — the import backend for the full 3D format range with
# materials/textures. `static-link` builds assimp from source and links it statically (ADR 0011).
russimp-ng = { version = "3.2", default-features = false }

# wasm viewer islands (browser-only; see crates/3dam-viewer). Kept out of the native build via
# per-target deps so `cargo build --workspace` stays a stub on non-wasm hosts.
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"
console_error_panic_hook = "0.1"
console_log = "1"
log = "0.4"

# media decode / encode (tech-spec 04 handlers + 08 convert). Pure-Rust where possible.
# `image` covers the v1 raster matrix (ADR 0009 §8); DDS/KTX2/EXR/HDR stage later.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tga", "tiff", "webp"] }
# `symphonia` is the audio decode/probe path (tech-spec 04 §7.1); curated to the v1 codec set.
symphonia = { version = "0.5", default-features = false, features = ["mp3", "flac", "vorbis", "ogg", "wav", "pcm", "adpcm", "isomp4", "aac", "aiff"] }
# WAV/PCM encode for the convert pipeline (tech-spec 08 §3.1).
hound = "3"
# Pure-Rust FFT for the EXPENSIVE-tier audio feature extractor (spectral flux / chroma, tech-spec 05
# §4.2). No system deps — keeps the default build model-free and offline (ADR 0006).
rustfft = "6"

# diagnostics
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
