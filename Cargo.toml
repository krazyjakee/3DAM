[workspace]
resolver = "2"
members = [
    "crates/3dam-api",
    "crates/3dam-store",
    "crates/3dam-media",
    "crates/3dam-sources",
    "crates/3dam-render",
    "crates/3dam-viewer",
    "crates/3dam-core",
    "crates/3dam-client",
    "crates/3dam-server",
    "crates/3dam-frontend",
    "crates/3dam-gui",
    "crates/3dam-cli",
    "crates/3dam",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/krazyjakee/3DAM"
rust-version = "1.85"

# One place for third-party versions; crates opt in with `dep.workspace = true`.
[workspace.dependencies]
# internal crates. Package names use the `dam-` prefix (cargo forbids a leading digit),
# so libs import as `dam_api`, `dam_core`, … exactly as the tech-spec pseudocode writes them.
# Directories keep the branded `3dam-` names; the shipped binary target is `3dam`.
dam-api = { path = "crates/3dam-api" }
dam-store = { path = "crates/3dam-store" }
dam-media = { path = "crates/3dam-media" }
dam-sources = { path = "crates/3dam-sources" }
dam-render = { path = "crates/3dam-render" }
dam-viewer = { path = "crates/3dam-viewer" }
dam-core = { path = "crates/3dam-core" }
dam-client = { path = "crates/3dam-client" }
dam-server = { path = "crates/3dam-server" }
dam-frontend = { path = "crates/3dam-frontend" }
dam-gui = { path = "crates/3dam-gui" }
dam-cli = { path = "crates/3dam-cli" }

# async / runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "signal", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
async-trait = "0.1"
futures = "0.3"

# serde / data
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
uuid = { version = "1", features = ["v7", "serde"] }
blake3 = "1"
bytes = "1"

# storage
rusqlite = { version = "0.40", features = ["bundled"] }

# http / server / client
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2"
# web-client embedding (tech-spec 09 §A.4): bake web/dist into the binary, MIME by extension.
rust-embed = { version = "8", features = ["mime-guess"] }

# cli
clap = { version = "4", features = ["derive"] }

# fs / platform
walkdir = "2"
directories = "5"

# render / gpu (wgpu pinned exactly — it breaks across minors; bump deliberately, tech-spec 06 §2).
# Consumed by the `wasm32` viewer islands now (tech-spec 09 §B.3) and by `dam-render` later (ADR 0002).
wgpu = "=30.0.0"
glam = "0.30"
bytemuck = { version = "1", features = ["derive"] }
gltf = { version = "1", default-features = false, features = ["import", "utils", "names"] }

# wasm viewer islands (browser-only; see crates/3dam-viewer). Kept out of the native build via
# per-target deps so `cargo build --workspace` stays a stub on non-wasm hosts.
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"
console_error_panic_hook = "0.1"
console_log = "1"
log = "0.4"

# diagnostics
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
