# `cargo xtask …` is the repo's dev-automation entrypoint (CLAUDE.md / README: `ci`, `web`, `wasm`).
# It resolves only through this alias — without it `cargo xtask` is "no such command" on a clean
# checkout, which broke the container build (and any fresh clone / CI lacking a global alias).
[alias]
xtask = "run --package xtask --"

# Otherwise the repo runs on Rust defaults, but Assimp's Draco decoder is a build-time
# CMake option and there is no other reproducible hook: `russimp-sys-ng`'s build script hardcodes its
# cmake defines and runs *before* any `dam-*` build script, so the flag must reach cmake via the
# environment. The `cmake` crate reads CMAKE_TOOLCHAIN_FILE, and a toolchain file is loaded early
# enough to force Assimp's `ASSIMP_BUILD_DRACO` cache variable on. See
# `crates/3dam-render/assimp-draco.cmake` and ADR 0011.
#
# Effect: `KHR_draco_mesh_compression` glTF/GLB (Unreal/Blender/gltfpack/asset-pack exports) now
# decode + thumbnail instead of failing to the typed tile. Only `russimp-sys-ng` invokes cmake, so
# this env var affects nothing else in the workspace.
[env]
CMAKE_TOOLCHAIN_FILE = { value = "crates/3dam-render/assimp-draco.cmake", relative = true, force = true }
