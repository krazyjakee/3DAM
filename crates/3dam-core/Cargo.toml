[package]
name = "dam-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The pure engine: EmbeddedLibrary over the store + handlers + sources; scan/query orchestration (tech-spec 01/05). No UI, transport, or GPU."

[dependencies]
dam-api.workspace = true
dam-store.workspace = true
dam-media.workspace = true
# Optional GPU renderer for server-side 3D turntable thumbnails (ADR 0002). Off by default so the
# native/CLI build stays GPU-free (crate-map invariant); `serve` opts in via the `render` feature.
dam-render = { workspace = true, optional = true }
dam-sources = { workspace = true, features = ["sftp", "smb"] }
tokio.workspace = true
tokio-stream.workspace = true
futures.workspace = true
async-trait.workspace = true
blake3.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
directories.workspace = true
# watch/auto-rescan (local FS change notification) + CSV manifest export (phase 4 Reach).
notify.workspace = true
csv.workspace = true

[features]
# 3D model thumbnails via the wgpu renderer. Pulls wgpu in transitively — enabled by `serve`, kept
# off for lean CLI/GUI builds where the honest typed tile is the intended 3D grid affordance.
render = ["dep:dam-render"]

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "rt-multi-thread"] }
image.workspace = true
hound.workspace = true
