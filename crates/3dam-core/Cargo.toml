[package]
name = "dam-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The pure engine: EmbeddedLibrary over the store + handlers + sources; scan/query orchestration (tech-spec 01/05). No UI, transport, or GPU."

[dependencies]
dam-api.workspace = true
dam-store.workspace = true
dam-media.workspace = true
# Optional GPU renderer for server-side 3D turntable thumbnails (ADR 0002). Off by default so the
# native/CLI build stays GPU-free (crate-map invariant); `serve` opts in via the `render` feature.
dam-render = { workspace = true, optional = true }
dam-sources = { workspace = true, features = ["sftp", "smb"] }
# Federated peers (phase 6, issue #39): the engine's query fan-out is a *client* of a peer's HTTP
# read API, and `ApiClient` is exactly that client — one transport, DTOs in lockstep by construction.
dam-client.workspace = true
url.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
futures.workspace = true
async-trait.workspace = true
blake3.workspace = true
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
directories.workspace = true
tempfile.workspace = true
# watch/auto-rescan (local FS change notification) + CSV manifest export (phase 4 Reach).
notify.workspace = true
csv.workspace = true
# Data-parallel CPU work: the whole-library analyze pass fans per-asset across cores (ADR 0007, #67).
rayon = "1"
# Semantic-embedding stack (semantic-search M4), all optional and pulled in only by the `semantic`
# feature: SigLIP runs on candle (ADR 0006 §runtime), text is tokenized with `tokenizers`, and
# `image` decodes + resizes to the vision tower's 224px input.
candle-transformers = { version = "0.11", optional = true }
candle-core = { version = "0.11", optional = true }
candle-nn = { version = "0.11", optional = true }
tokenizers = { version = "0.23", optional = true }
image = { workspace = true, features = ["png", "jpeg"], optional = true }
# CLAP audio tower runs on ONNX Runtime via `ort` (the audio analogue of candle-SigLIP). `load-dynamic`
# links libonnxruntime at runtime (dlopen) rather than at build, so enabling `semantic` never triggers
# a build-time binary download and the default build stays offline/model-free (ADR 0006). The mel
# front-end it consumes is pure `dam-media` DSP.
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["load-dynamic"], optional = true }

# Host-resource awareness (tech-spec 14 §5): renice + idle-ioprio the background workers on Linux
# so co-tenant workloads preempt 3DAM's grind. Linux-only; other platforms skip the calls.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { workspace = true, features = ["linux-native-async-persistent", "async-io", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { workspace = true, features = ["windows-native"] }

[features]
# 3D model thumbnails via the wgpu renderer. Pulls wgpu in transitively — enabled by `serve`, kept
# off for lean CLI/GUI builds where the honest typed tile is the intended 3D grid affordance.
render = ["dep:dam-render"]
# 3D container transcode for the convert pipeline (issue #49). Separate from `render`: one is a GPU
# thumbnail path, the other is a CPU encode, and a headless convert build should not need wgpu.
model-convert = ["dam-media/model-convert"]
# Model-backed semantic embeddings behind the EmbeddingSpace seam (semantic-search M4, ADR 0006).
# Off by default: the model-free `*-stats-v1` descriptors stand in. Enabling it compiles the real
# candle SigLIP encoder (image + text towers); it activates at runtime only when model weights are
# present under the data dir (see crates/3dam-core/src/semantic.rs), else it logs and returns None.
# Audio is CLAP via `ort` (this feature); 3D (multi-view render → SigLIP) is the remaining M4 sub-path.
semantic = [
    "dep:candle-transformers",
    "dep:candle-core",
    "dep:candle-nn",
    "dep:tokenizers",
    "dep:image",
    "dep:ort",
]

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "rt-multi-thread"] }
image = { workspace = true, features = ["png"] }
hound.workspace = true
rusqlite.workspace = true
