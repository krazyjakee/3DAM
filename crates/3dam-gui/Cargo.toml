[package]
name = "dam-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native desktop shell (egui/eframe, ADR 0005) over the LibraryService seam (tech-spec 12)."

[dependencies]
# The seam: the trait + DTOs, and the shared backend opener — the GUI links neither the engine
# internals nor the clap grammar (crate-map invariant; it goes through `dam-frontend::open_backend`).
dam-api = { workspace = true }
dam-frontend = { workspace = true }
# Parse/validate the `--connect` endpoint and the in-app Connect dialog into the `Url` that
# `dam_frontend::Backend::Connected` carries (issue #70, hosted mode).
url = { workspace = true }
# A background Tokio runtime owns the async `LibraryService`; the egui thread talks to it over
# channels so I/O never blocks the frame (golden rule 5).
tokio = { workspace = true }
# Decode the server's PNG thumbnails (off-thread) into RGBA for egui textures.
image = { workspace = true }
# Consume the engine's `LibraryService::subscribe` event stream (live updates).
futures = { workspace = true }
# Audio preview playback in the inspector (cpal/ALSA under the hood). Default codecs cover WAV/FLAC/
# MP3/Vorbis; symphonia backs the rest.
rodio = { version = "0.19", default-features = false, features = ["symphonia-all"] }
# Interactive 3D viewer maths + DMSH blob unpacking. wgpu itself comes from `eframe::wgpu`
# (egui-wgpu's version, 24) so the offscreen renderer matches eframe's device — never the workspace
# wgpu 30 (dam-render/dam-viewer), which would be a second, incompatible instance here.
glam = "0.30"
bytemuck = { version = "1", features = ["derive", "extern_crate_alloc"] }

# egui/eframe (ADR 0005). wgpu backend — enables egui-wgpu paint callbacks for the interactive 3D
# viewer, and (unlike glow's OpenGL context) coexists with dam-render's wgpu without an EGL clash.
eframe = { version = "0.31", default-features = false, features = [
    "default_fonts",
    "wgpu",
    "wayland",
    "x11",
] }
# Phosphor line-icons (the lucide-equivalent the web client uses) so the native GUI ships the same
# iconography instead of emoji/text glyphs (issue #68 parity). 0.9 tracks egui 0.31.
egui-phosphor = "0.9"
