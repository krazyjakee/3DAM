[package]
name = "dam"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The 3dam binary: role dispatch only (tech-spec 01 §5). One binary, four roles."

[[bin]]
name = "3dam"
path = "src/main.rs"

[dependencies]
dam-frontend.workspace = true
dam-cli.workspace = true
dam-desktop.workspace = true
tokio.workspace = true

[features]
# Opt-in production ANN acceleration; `cargo build -p dam --features ann`.
ann = ["dam-cli/ann", "dam-desktop/ann"]
