[package]
name = "dam-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "axum server: HTTP/WS API mirroring LibraryService, web-asset host, MCP mount (tech-spec 09/11). Serves the embedded engine."

[dependencies]
dam-api.workspace = true
# `render` pulls the wgpu renderer so `serve` can produce 3D model turntable thumbnails (ADR 0002).
# The whole `3dam` binary links dam-server, so this turns rendering on for every role by unification
# while dam-core itself stays GPU-free by default for pure-library consumers.
dam-core = { workspace = true, features = ["render", "model-convert"] }
axum.workspace = true
# In-process TLS (issue #75): HTTPS from a cert/key for a hosted deployment (no `--insecure`).
axum-server = { workspace = true }
rustls = { workspace = true }
# Brotli/gzip response negotiation. Compression is streamed by tower-http; immutable web assets
# normally take the precompressed sidecar path generated by Vite instead (issue #149).
tower-http = { workspace = true, features = ["compression-br", "compression-gzip"] }
rust-embed.workspace = true
tokio.workspace = true
tokio-util.workspace = true
serde.workspace = true
serde_json.workspace = true
futures.workspace = true
tracing.workspace = true
anyhow.workspace = true
# server config/flags/token/audit store — a small SQLite `server.db`, separate from the metadata
# DB (tech-spec 10 §2.1). blake3 hashes token secrets; uuid mints token ids + high-entropy secrets.
rusqlite.workspace = true
blake3.workspace = true
uuid.workspace = true
# argon2id password hashing for user accounts (phase 6, issue #42).
argon2.workspace = true
# serve config file (tech-spec 09 §A.1).
toml.workspace = true
# OIDC/OAuth2 login (issue #41): discovery, PKCE, and ID-token validation against the issuer's JWKS.
openidconnect.workspace = true
# Decode the two bounded JWT header/payload segments before cryptographic verification so an
# unknown issuer/algorithm can be rejected without an outbound JWKS request.
base64.workspace = true
# Outbound HTTP for the OIDC discovery/token/JWKS calls (the same client dam-client already uses).
reqwest.workspace = true
# Validating the issuer/redirect URLs an operator configures, before a user meets the failure.
url.workspace = true
# Stages an upload body on real disk before it is written into a source (issue #80). The temp file
# is removed on drop, so a client that disconnects mid-transfer leaves nothing behind.
tempfile.workspace = true
# Package server-managed multi-file exports/conversions for authenticated browser retrieval.
zip.workspace = true

[dev-dependencies]
dam-client.workspace = true
# drive the router in-process (no port bind) via `ServiceExt::oneshot` (phase-5 integration tests).
tower = { workspace = true, features = ["util"] }
# analyzable PNG fixtures for the federation similarity tests (phase 6, issue #40).
image = { workspace = true, features = ["png"] }
# `StreamExt::next` for draining a `subscribe` stream (the restricted-subscriber test, issue #42).
futures.workspace = true
# The in-process OIDC issuer (tests/support/oidc_issuer.rs) needs two things `openidconnect` uses
# internally but does not re-export: `chrono` to stamp `exp`/`iat` on an ID token, and `base64` to
# read back the HTTP Basic client credential the token exchange authenticates with. Both versions
# are already in the tree via openidconnect itself, so this adds no packages.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Decode negotiated responses in the compression integration tests and power the dependency-free
# transfer-size/CPU benchmark under `benches/compression.rs`.
brotli = "8"
flate2 = "1"

[[bench]]
name = "compression"
harness = false
