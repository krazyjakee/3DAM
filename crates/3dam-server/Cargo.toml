[package]
name = "dam-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "axum server: HTTP/WS API mirroring LibraryService, web-asset host, MCP mount (tech-spec 09/11). Serves the embedded engine."

[dependencies]
dam-api.workspace = true
# `render` pulls the wgpu renderer so `serve` can produce 3D model turntable thumbnails (ADR 0002).
# The whole `3dam` binary links dam-server, so this turns rendering on for every role by unification
# while dam-core itself stays GPU-free by default for pure-library consumers.
dam-core = { workspace = true, features = ["render"] }
axum.workspace = true
# In-process TLS (issue #75): HTTPS from a cert/key for a hosted deployment (no `--insecure`).
axum-server = { workspace = true }
rustls = { workspace = true }
tower-http.workspace = true
rust-embed.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
futures.workspace = true
tracing.workspace = true
anyhow.workspace = true
# server config/flags/token/audit store — a small SQLite `server.db`, separate from the metadata
# DB (tech-spec 10 §2.1). blake3 hashes token secrets; uuid mints token ids + high-entropy secrets.
rusqlite.workspace = true
blake3.workspace = true
uuid.workspace = true
# argon2id password hashing for user accounts (phase 6, issue #42).
argon2.workspace = true
# serve config file (tech-spec 09 §A.1).
toml.workspace = true
# Stages an upload body on real disk before it is written into a source (issue #80). The temp file
# is removed on drop, so a client that disconnects mid-transfer leaves nothing behind.
tempfile.workspace = true

[dev-dependencies]
# drive the router in-process (no port bind) via `ServiceExt::oneshot` (phase-5 integration tests).
tower = { workspace = true, features = ["util"] }
# analyzable PNG fixtures for the federation similarity tests (phase 6, issue #40).
image.workspace = true
# `StreamExt::next` for draining a `subscribe` stream (the restricted-subscriber test, issue #42).
futures.workspace = true
