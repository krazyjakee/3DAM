[package]
name = "dam-store"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SQLite metadata store: schema, migrations, and row↔DTO queries (tech-spec 02). Private to 3dam-core."

[dependencies]
dam-api.workspace = true
# The connection model + secret-free display URI live in dam-sources; the store persists the
# connection blob and hands back a `SourceConnection`. Network backends aren't needed here, so the
# heavy SFTP/SMB stack is dropped (default-features = false).
dam-sources = { workspace = true }
rusqlite.workspace = true
uuid.workspace = true
serde_json.workspace = true
tracing.workspace = true
