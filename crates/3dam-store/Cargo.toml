[package]
name = "dam-store"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SQLite metadata store: schema, migrations, and row↔DTO queries (tech-spec 02). Private to 3dam-core."

[dependencies]
dam-api.workspace = true
# The connection model + secret-free display URI live in dam-sources; the store persists only its
# non-secret fields plus an opaque auth_ref. Network backends aren't needed here, so the
# heavy SFTP/SMB stack is dropped (default-features = false).
dam-sources = { workspace = true }
rusqlite.workspace = true
uuid.workspace = true
serde_json.workspace = true
serde.workspace = true
base64.workspace = true
tracing.workspace = true
blake3.workspace = true
# Optional HNSW ANN index (semantic-search M6). Off by default: the brute-force cosine scan is exact
# and adequate at v1 scale. The `ann` feature swaps in an approximate index for large embedding
# spaces (100k+), keeping brute-force as the fallback. `instant-distance` is the decided backend
# (docs/adr/0016-vector-index-backend.md): one pure-Rust crate, no build script and no C++
# toolchain, which the spike's faster `usearch` is not. `sqlite-vec` was dropped outright.
instant-distance = { version = "0.6.1", optional = true }

[dev-dependencies]
# The connection-pool tests (src/db.rs) need a real file-backed catalog; in-memory stores are
# single-connection by construction and cannot exercise pooling.
tempfile.workspace = true

[features]
# HNSW nearest-neighbour acceleration for similarity/hybrid search (M6). See src/ann.rs and
# docs/adr/0016-vector-index-backend.md.
ann = ["dep:instant-distance"]
