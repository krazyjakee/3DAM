[package]
name = "dam-sources"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Source trait + file sources (local FS, SFTP, SMB; federated later) — tech-spec 07."

[features]
# SFTP/SMB backends are on by default but gated so a minimal build can drop the network stack.
# Both are pure-Rust (no native libs). See the workspace manifest for the russh version pin.
default = ["sftp", "smb"]
sftp = ["dep:russh", "dep:russh-sftp"]
smb = ["dep:smb"]

[dependencies]
dam-api.workspace = true
walkdir.workspace = true
tempfile.workspace = true
serde = { workspace = true }
serde_json.workspace = true
tracing.workspace = true
url.workspace = true
# Remote backends are async; the sync FileSource methods drive them on a private current-thread
# runtime (scan runs inside spawn_blocking, off the async workers — tech-spec 14).
tokio = { workspace = true }
futures = { workspace = true }

russh = { workspace = true, optional = true }
russh-sftp = { workspace = true, optional = true }
smb = { workspace = true, optional = true }

[dev-dependencies]
# The in-process SFTP test server (tests/support) binds a real loopback listener, so the test
# build needs tokio's `net` on top of the feature set the library itself uses.
tokio = { workspace = true, features = ["net"] }

# `faccessat` for the upload writability probe (issue #80) — see `LocalFsSource::writable`.
[target.'cfg(unix)'.dependencies]
libc.workspace = true
