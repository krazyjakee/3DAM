[package]
name = "dam-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The clap command tree, human/--json output, and the serve/mcp entry points (tech-spec 13)."

[dependencies]
dam-api.workspace = true
dam-frontend.workspace = true
dam-server.workspace = true
# The admin surface over `--connect` is driven through the API client (tech-spec 10 §5 parity);
# the embedded admin path opens the server store from `dam-server` directly (ADR 0009 §2), and the
# embedded storage-maintenance ops open the engine (`EmbeddedLibrary`) for their inherent methods.
dam-client.workspace = true
dam-core.workspace = true
# Only to ask what 3D targets this build can write, so `convert --to glb` is refused up front in a
# binary compiled without `model-convert` rather than failing per item (issue #49).
dam-media.workspace = true
clap.workspace = true
tokio.workspace = true
serde_json.workspace = true
anyhow.workspace = true
url.workspace = true
tracing-subscriber.workspace = true
