[package]
name = "dam-viewer"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Browser WASM/wgpu 3D model viewer embedded in the web client (tech-spec 09 §B.3, ADR 0009 §9). WebGPU with WebGL2 fallback."

# `cdylib` is what wasm-bindgen/wasm-pack link into the `.wasm`; `rlib` keeps the crate usable
# as a normal library dependency (and lets `cargo doc`/tests see it on native).
[lib]
crate-type = ["cdylib", "rlib"]

# Heavy GPU + browser deps are browser-only. Gating them behind the `wasm32` target keeps
# `cargo build --workspace` on a native host compiling only the tiny stub in lib.rs — the
# island never pulls wgpu/web-sys into the server/CLI/GUI build (tech-spec 01 crate boundaries).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { workspace = true, features = ["webgl"] }
glam.workspace = true
# `extern_crate_alloc` enables `pod_collect_to_vec`, which copies the `DMSH` blob's (unaligned)
# vertex/index runs into typed Vecs — `cast_slice` would panic on the blob's arbitrary alignment.
bytemuck = { workspace = true, features = ["extern_crate_alloc"] }
# Decode the preview blob's PNG-packed material textures. The workspace declaration has no codec
# features; this target adds only PNG so the WASM island does not pull the native raster matrix.
image = { workspace = true, features = ["png"] }
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = [
    "Window",
    "HtmlCanvasElement",
    "console",
] }
console_error_panic_hook.workspace = true
console_log.workspace = true
log.workspace = true

# Release builds use Binaryen's size-optimising pass through wasm-pack. Keeping the exact pass list
# here (instead of an ad-hoc post-build command) makes local, CI, and release artifacts follow one
# deterministic pipeline. CI pins wasm-pack, which in turn pins the compatible Binaryen build.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-bulk-memory"]
