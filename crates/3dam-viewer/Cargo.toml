[package]
name = "dam-viewer"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Browser WASM/wgpu viewer islands (3D model + audio waveform) embedded in the web client (tech-spec 09 §B.3, ADR 0009 §9). WebGPU with WebGL2 fallback."

# `cdylib` is what wasm-bindgen/wasm-pack link into the `.wasm`; `rlib` keeps the crate usable
# as a normal library dependency (and lets `cargo doc`/tests see it on native).
[lib]
crate-type = ["cdylib", "rlib"]

# Heavy GPU + browser deps are browser-only. Gating them behind the `wasm32` target keeps
# `cargo build --workspace` on a native host compiling only the tiny stub in lib.rs — the
# island never pulls wgpu/web-sys into the server/CLI/GUI build (tech-spec 01 crate boundaries).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { workspace = true, features = ["webgl"] }
glam.workspace = true
bytemuck.workspace = true
gltf.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = [
    "Window",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "console",
] }
console_error_panic_hook.workspace = true
console_log.workspace = true
log.workspace = true

# `wasm-opt` is run by wasm-pack; disable its bundled auto-download in CI-less envs via
# the profile below rather than a build script.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
