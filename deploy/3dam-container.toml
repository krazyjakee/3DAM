# Flag seeds baked into the container image (deploy/Dockerfile) — the out-of-the-box "appliance"
# posture: spin up the container, open the web UI, and everything works with no tokens and no flag
# flipping. The Docker network boundary (which ports you publish, to whom) is the trust boundary,
# consistent with the image's default `--insecure` bind.
#
# Seeds apply on FIRST RUN only (config_authority = seed-only, ADR 0009 §2); after that the admin
# UI/CLI owns the flags, so opting into auth later sticks across restarts. To harden, use the web
# Settings page or `docker exec <name> 3dam admin flag … --data /var/lib/3dam`, or start from
# deploy/3dam.example.toml (the hardened template) instead.

[flags]
# No authentication until the operator configures it: every client on the published port has full
# owner trust, exactly like a fresh localhost `3dam serve`. (This is also the built-in default —
# stated here so the container's posture is explicit.)
auth = "off"

# The container must bind 0.0.0.0 for the published port to be reachable, which makes every client —
# including the operator's own browser — a "network" caller. Without this seed the core off-by-default
# ceiling (network_writes = false) would leave the web UI read-only out of the box, unable even to
# add a source. Inside the container's trust boundary that gate serves no one, so open it.
network_writes = true

# Serve this instance as a federation peer (phase 6, issue #39): another 3DAM instance can add it
# as a `3dam://host:7878` source and browse/search its catalog merged into its own. The appliance
# posture is "the server everyone points at", so the advertise surface ships on; the reads a peer
# performs are the same read API every browser on the published port already has.
federation = true

# NB: the background pipeline the two auto_* flags drive is host-governed (tech-spec 14 §5): at
# most 4 worker threads (fewer under a container CPU quota), reniced to yield to co-tenants, and
# bulk work (scan hashing included) automatically PAUSED while the host is short on memory,
# overloaded, or its disk is stalled under bulk I/O (PSI full-stall above 25% — the slow-HDD
# blockade signal). Tune with a `[resources]` block here or the 3DAM_BG_THREADS /
# 3DAM_MIN_FREE_MEMORY_MB / 3DAM_MAX_IO_STALL_PCT environment variables — and prefer also giving
# the container an explicit budget (`--memory 4g --cpus 2`) on a shared box.
