# Example 3DAM serve config (tech-spec 09 §A.1) — the HARDENED template for a public or untrusted
# network: token auth required for everything, network read-only, TLS in-process. This is NOT what
# the container ships by default (that is deploy/3dam-container.toml: auth off + network writes on,
# trusting the Docker network boundary) — start from this file when the network is not trusted.
#
# Everything is optional — a missing file just uses the built-in defaults. CLI flags (--addr,
# --tls-cert, --tls-key) override the matching keys here. Flag values are *seed-only*: they set the
# initial value on first run; the admin UI/CLI owns them thereafter (config_authority = seed-only,
# ADR 0009 §2). Note: with `auth = "token"` no client — including the served web UI — can do anything
# until you mint a token (`3dam admin token add <label> --scope read,write`) and paste it into the
# client's Connect dialog.

[server]
# Bind address + port. For a public host use 0.0.0.0 with TLS below; for a reverse-proxy setup keep
# this on 127.0.0.1 and terminate TLS in front.
bind = "0.0.0.0"
port = 7878

# In-process TLS (issue #75). With both set, `serve` speaks HTTPS and needs no --insecure to bind
# beyond localhost. PEM files: a full cert chain and its private key.
tls_cert = "/etc/3dam/tls/fullchain.pem"
tls_key  = "/etc/3dam/tls/privkey.pem"

# Force `Secure` on the user-account session + CSRF cookies even though this process speaks
# plaintext. Set this when a reverse proxy terminates TLS in front (the browser is on HTTPS but
# `serve` only sees loopback HTTP, so it cannot tell). Deliberately not inferred from
# X-Forwarded-Proto — a forwarded header is attacker-controlled unless the proxy strips it.
#secure_cookies = true

# Socket-peer IPs of reverse proxies trusted to SET client attribution for auth rate limiting.
# Empty by default: direct deployments ignore every forwarding header and key limits on the peer
# socket. A named proxy MUST strip any inbound X-Forwarded-For and replace it with exactly one bare
# IPv4/IPv6 address. Missing, invalid, repeated, or comma-list values collapse into a shared
# "unknown behind this proxy" bucket (safe but stricter); X-Real-IP and Forwarded are never trusted.
# For a same-host Caddy/nginx/Traefik deployment this is normally:
#trusted_proxies = ["127.0.0.1", "::1"]

[flags]
# Require a bearer token for the API/MCP/admin surface (issue tokens with `3dam admin token create`).
# Off = the local owner has full trust (only safe on localhost).
auth = "token"

# Agent (MCP) endpoint: off | read_only | read_write.
mcp = "off"

# Allow writes from beyond localhost. Off = read-only to the network.
network_writes = false

# Hosted-mode background pipeline (issue #71). Both default on — the server proactively renders
# thumbnails/previews and runs analysis on ingest so clients hit ready data. Set false on a
# low-power host to defer that grind to on-demand generation.
auto_thumbnail = true
auto_analyze   = true

# Federation peer mode (phase 6, issue #39): serve `GET /api/v1/advertise` so other 3DAM instances
# can add this one as a `3dam://` source and merge its catalog into their queries. Off by default —
# off means the surface disappears (ADR 0004). Peer reads ride the normal auth gate above, so in
# token mode a peer needs a read-scoped bearer token (`--password` on `sources add`).
federation = false

[accounts]
# Full user accounts (see `[flags] user_accounts`). Both keys below are per-boot operator switches,
# not runtime flags.

# Require the bootstrap owner token for EVERY first-run claim, including one from a loopback peer
# (ADR 0014). Set this whenever a reverse proxy fronts this server: from the server's point of view
# a proxied request *is* a loopback peer, so the friendly "claim from localhost" path would be
# reachable from the internet. The claim gate already refuses any request carrying
# X-Forwarded-For / X-Real-IP / Forwarded, but a proxy that strips them leaves no signal — this is
# the explicit switch. Redeem the token printed to <data>/bootstrap-owner-token.txt as an
# `Authorization: Bearer …` on POST /api/v1/auth/claim.
#require_claim_token = true

# Recovery hatch: re-open the first-run claim window for ONE boot so a lost sole admin can be
# replaced. Audited and warned about loudly. Remove it again immediately after recovery.
#reopen_claim = true

[resources]
# Good-neighbour limits (tech-spec 14 §5) for the bulk work (scan hashing, thumbnail pre-render,
# the analysis pass). 3DAM already self-governs with no config: the background pool is sized from
# the *effective* CPU budget (container cgroup quota respected), hard-capped at 4 threads, reniced
# to yield to anything else on the box, and bulk work PAUSES automatically whenever host available
# memory drops below a floor (default 10% of RAM, clamped 256 MiB – 2 GiB), the 1-min load runs
# beyond the CPU budget, or the disk is stalled under bulk I/O (PSI full-stall avg10 above a
# ceiling, default 25% — the signal that catches slow/bulk HDD reads blockading the whole box,
# which loadavg and memory cannot see; requires PSI, kernel ≥ 4.20). These knobs tune that
# governor; the same set is honoured as environment variables (3DAM_BG_THREADS /
# 3DAM_MIN_FREE_MEMORY_MB / 3DAM_MAX_IO_STALL_PCT) for container/systemd deployments.
# Setting max_io_stall_pct to 100 disables the I/O gate.
#background_threads = 2
#min_free_memory_mb = 2048
#max_io_stall_pct = 25
