name: ci

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The full workspace links several native-heavy test binaries. GitHub's
  # hosted runners can exhaust their ephemeral disk when Cargo emits complete
  # debug information for each one; symbols are not required for this gate.
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  msrv:
    name: Rust 1.91 / default features
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-1.91
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake libclang-dev libgtk-3-dev librsvg2-dev \
            libssl-dev libwebkit2gtk-4.1-dev pkg-config
      - name: Check workspace at the supported floor
        run: cargo check --workspace --locked

  format:
    name: Rustfmt
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  tests:
    name: Rust tests / default features
    # Runs on the self-hosted 3dam runner pair (Portainer git-runners stack). Those containers
    # bake in a shared CARGO_HOME + a local sccache (RUSTC_WRAPPER / CMAKE_*_COMPILER_LAUNCHER),
    # so the heavy dependency + Assimp compile is cached on-box across runs.
    runs-on: [self-hosted, Linux, X64, 3dam]
    # The two runners share one 7-core LXC. cargo's default -j7 means two concurrent jobs (this +
    # a features leg) oversubscribe 2x and thrash; cap parallelism so both fit with headroom (and
    # to avoid this box's known parallel-link OOM). 90 min matches the features ceiling.
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: "4"
    steps:
      - uses: actions/checkout@v4
      # rustup lives in the persistent $CARGO_HOME cache volume; install it once if the volume is
      # fresh, then expose it on PATH so dtolnay/rust-toolchain (next step) can manage the toolchain.
      - name: Ensure rustup is present in the cache volume
        run: |
          if [ ! -x "$CARGO_HOME/bin/rustup" ]; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --no-modify-path --profile minimal --default-toolchain none
          fi
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@stable
      # No Swatinem/rust-cache: the on-box sccache + shared CARGO_HOME already cache this work, and
      # saving it to the GitHub Actions cache would just re-consume the 10 GB per-repo cache budget.
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake libclang-dev libgtk-3-dev librsvg2-dev \
            libssl-dev libwebkit2gtk-4.1-dev pkg-config
      - run: cargo test --workspace --locked

  features:
    name: Rust features / ${{ matrix.profile }}
    # Self-hosted 3dam runners (see the tests job) — 6 matrix legs share the 2-runner pair, so they
    # queue two at a time; each leg is fast against the warm sccache / CARGO_HOME.
    runs-on: [self-hosted, Linux, X64, 3dam]
    timeout-minutes: 90
    # Cap cargo parallelism: two legs (or a leg + the tests job) share one 7-core box.
    env:
      CARGO_BUILD_JOBS: "4"
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: sources
            native: false
          - profile: media
            native: true
          - profile: core
            native: true
          - profile: viewer
            native: false
          - profile: binary
            native: true
          - profile: workspace-all
            native: true
    steps:
      - uses: actions/checkout@v4
      # See the tests job: bootstrap rustup from the cache volume, then let dtolnay add the
      # clippy component + wasm target (they persist in the shared RUSTUP_HOME volume).
      - name: Ensure rustup is present in the cache volume
        run: |
          if [ ! -x "$CARGO_HOME/bin/rustup" ]; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --no-modify-path --profile minimal --default-toolchain none
          fi
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      # No Swatinem/rust-cache: see the tests job.
      - name: Install native dependencies
        if: matrix.native
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake libclang-dev libgtk-3-dev librsvg2-dev \
            libssl-dev libwebkit2gtk-4.1-dev pkg-config
      - name: Clippy every supported profile
        run: cargo run --locked --package xtask -- feature-matrix ${{ matrix.profile }}
      - name: Assert lean dependency boundaries
        if: matrix.profile == 'sources'
        shell: bash
        run: |
          set -euo pipefail
          assert_absent() {
            local profile="$1" command="$2" forbidden="$3"
            if eval "${command}" | grep -E "${forbidden}"; then
              echo "::error::${profile} contains a dependency outside its lean boundary"
              exit 1
            fi
          }
          assert_absent "lean core" \
            "cargo tree --locked -p dam-core --no-default-features --edges normal --prefix none" \
            "^(ash|glow|gpu-alloc|gpu-allocator|naga|tao|tauri|winit|wgpu|wry)( |-)|^dam-render "
          assert_absent "lean media" \
            "cargo tree --locked -p dam-media --no-default-features --edges normal --prefix none" \
            "^russimp(-| )"
          assert_absent "local sources" \
            "cargo tree --locked -p dam-sources --no-default-features --edges normal --prefix none" \
            "^(russh|russh-sftp|smb)( |-)"

  dependencies:
    name: Dependency hygiene
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: dependency-hygiene
      - name: Require a current lockfile and reviewed internal edges
        run: |
          cargo metadata --no-deps --format-version 1 --locked > /dev/null
          cargo run --locked --package xtask -- check-deps
      - name: Check advisories, licenses, bans, and sources
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: "1.91.0"
          command: check
          arguments: --all-features
      - name: Assert dependency checks did not rewrite the lockfile
        run: git diff --exit-code -- Cargo.lock

  web:
    name: Web lint, typecheck & build
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: web-ci
      - uses: taiki-e/install-action@v2
        with:
          # wasm-pack pins the Binaryen build used by the deterministic `-Oz` release pass.
          tool: wasm-pack@0.13.1
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build WASM islands and web client
        run: cargo run --locked --package xtask -- web
      - name: Lint and typecheck web client
        working-directory: web
        run: |
          pnpm run lint
          pnpm run typecheck

  required:
    name: Required CI
    if: always()
    needs: [msrv, format, tests, features, dependencies, web]
    runs-on: ubuntu-22.04
    steps:
      - name: Require every quality gate
        env:
          RESULTS: >-
            ${{ needs.msrv.result }} ${{ needs.format.result }} ${{ needs.tests.result }}
            ${{ needs.features.result }} ${{ needs.dependencies.result }} ${{ needs.web.result }}
        run: |
          for result in ${RESULTS}; do
            test "${result}" = success
          done
