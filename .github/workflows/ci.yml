name: ci

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The full workspace links several native-heavy test binaries. GitHub's
  # hosted runners can exhaust their ephemeral disk when Cargo emits complete
  # debug information for each one; symbols are not required for this gate.
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  msrv:
    name: Rust 1.91 / default features
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-1.91
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake libclang-dev libgtk-3-dev librsvg2-dev \
            libssl-dev libwebkit2gtk-4.1-dev pkg-config
      - name: Check workspace at the supported floor
        run: cargo check --workspace --locked

  format:
    name: Rustfmt
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  tests:
    name: Rust tests / default features
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: stable-tests-default
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake libclang-dev libgtk-3-dev librsvg2-dev \
            libssl-dev libwebkit2gtk-4.1-dev pkg-config
      - run: cargo test --workspace --locked

  features:
    name: Rust features / ${{ matrix.profile }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: sources
            native: false
          - profile: media
            native: true
          - profile: core
            native: true
          - profile: viewer
            native: false
          - profile: binary
            native: true
          - profile: workspace-all
            native: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: feature-${{ matrix.profile }}
      - name: Install native dependencies
        if: matrix.native
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake libclang-dev libgtk-3-dev librsvg2-dev \
            libssl-dev libwebkit2gtk-4.1-dev pkg-config
      - name: Clippy every supported profile
        run: cargo run --locked --package xtask -- feature-matrix ${{ matrix.profile }}
      - name: Assert lean dependency boundaries
        if: matrix.profile == 'sources'
        shell: bash
        run: |
          set -euo pipefail
          assert_absent() {
            local profile="$1" command="$2" forbidden="$3"
            if eval "${command}" | grep -E "${forbidden}"; then
              echo "::error::${profile} contains a dependency outside its lean boundary"
              exit 1
            fi
          }
          assert_absent "lean core" \
            "cargo tree --locked -p dam-core --no-default-features --edges normal --prefix none" \
            "^(ash|glow|gpu-alloc|gpu-allocator|naga|tao|tauri|winit|wgpu|wry)( |-)|^dam-render "
          assert_absent "lean media" \
            "cargo tree --locked -p dam-media --no-default-features --edges normal --prefix none" \
            "^russimp(-| )"
          assert_absent "local sources" \
            "cargo tree --locked -p dam-sources --no-default-features --edges normal --prefix none" \
            "^(russh|russh-sftp|smb)( |-)"

  dependencies:
    name: Dependency hygiene
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: dependency-hygiene
      - name: Require a current lockfile and reviewed internal edges
        run: |
          cargo metadata --no-deps --format-version 1 --locked > /dev/null
          cargo run --locked --package xtask -- check-deps
      - name: Check advisories, licenses, bans, and sources
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: "1.91.0"
          command: check
          arguments: --all-features
      - name: Assert dependency checks did not rewrite the lockfile
        run: git diff --exit-code -- Cargo.lock

  web:
    name: Web lint, typecheck & build
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: web-ci
      - uses: taiki-e/install-action@v2
        with:
          # wasm-pack pins the Binaryen build used by the deterministic `-Oz` release pass.
          tool: wasm-pack@0.13.1
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build WASM islands and web client
        run: cargo run --locked --package xtask -- web
      - name: Lint and typecheck web client
        working-directory: web
        run: |
          pnpm run lint
          pnpm run typecheck

  required:
    name: Required CI
    if: always()
    needs: [msrv, format, tests, features, dependencies, web]
    runs-on: ubuntu-22.04
    steps:
      - name: Require every quality gate
        env:
          RESULTS: >-
            ${{ needs.msrv.result }} ${{ needs.format.result }} ${{ needs.tests.result }}
            ${{ needs.features.result }} ${{ needs.dependencies.result }} ${{ needs.web.result }}
        run: |
          for result in ${RESULTS}; do
            test "${result}" = success
          done
