# ============================================================================
# Cross-platform release pipeline for 3DAM (issue #45, PRODUCT_SPEC §9 phase 7).
#
# Canonical plan: docs/tech-spec/15-observability-config-testing-packaging.md §15.5.
#
# Shape:
#   plan  → resolve tag/version + which targets to build
#   web   → build the React client + WASM islands ONCE, share as an artifact
#   build → per-target: cargo build, portable archive, smoke test, native installers
#   publish → tag-only: checksum everything and cut the GitHub Release
#
# Two things worth knowing before editing:
#
# 1. The web client is built once, in its own job, and downloaded by every build leg. It is
#    platform-independent, so building it four times would be four chances to differ — and it
#    keeps pnpm/node/wasm-pack off the macOS and Windows runners entirely. `cargo xtask wasm`
#    *silently succeeds* when wasm-pack is missing (xtask/src/main.rs), which would ship a
#    client whose viewer islands fail to load, so the web job asserts its outputs exist
#    rather than trusting the exit code.
#
# 2. Native installers come from the Tauri bundler, which the repo already depends on and has
#    fully configured (crates/3dam-desktop/tauri.conf.json: identifier, publisher, category,
#    all six icons). It produces deb/AppImage, app/dmg and msi/nsis from one config —
#    downloading WiX and NSIS itself on Windows — so there is no cargo-wix/cargo-deb, no
#    hand-rolled Info.plist, and no second source of truth for app metadata.
#
# Signing/notarization is deliberately absent: tech-spec 15 §15.5 "Open questions" records the
# 2026-07-06 decision to ship v1 unsigned and accept the Gatekeeper/SmartScreen warnings.
# ============================================================================
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      targets:
        description: >-
          Which targets to build. This repo is private, so runner minutes are billed with
          multipliers (macOS 10x, Windows 2x, Linux 1x) — keep pipeline test runs on `linux`.
        type: choice
        options: [linux, macos, windows, all]
        default: linux

permissions:
  contents: write

# Two tags pushed in quick succession would otherwise race to create the same GitHub Release.
# Never cancel in progress: a half-finished release build is worse than a slow one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── plan ──────────────────────────────────────────────────────────────────
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # A tag must agree with the workspace version. The Tauri bundler reads the version from
      # Cargo.toml while the archive names come from the tag, so a mismatch would ship a
      # `3dam-v0.2.0-…tar.gz` next to a `3DAM_0.1.1_amd64.deb` — same commit, two versions,
      # and nothing downstream would notice. Fail here instead.
      - name: Resolve tag and version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          # `cargo pkgid` prints `path+file:///…/crates/3dam#dam@0.1.1`; the version is
          # everything after the last `@`. Preferred over `cargo metadata | jq` so the check
          # needs nothing beyond cargo and can be exercised locally.
          #
          # `--locked` is load-bearing, not decoration: without it cargo would silently
          # regenerate a stale Cargo.lock and report the *new* Cargo.toml version, so a bump
          # that forgot the lockfile would pass this check and instead fail every build leg at
          # `cargo build --locked` — after paying for a full Assimp compile on 10x-billed macOS.
          crate_version="$(cargo pkgid --locked -p dam)"
          crate_version="${crate_version##*@}"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
            if [[ "${version}" != "${crate_version}" ]]; then
              echo "::error::tag ${tag} implies version ${version}, but the workspace is at ${crate_version}. Bump [workspace.package] version in Cargo.toml (and Cargo.lock) to match, or retag."
              exit 1
            fi
          else
            # A manual run is not a release: name artifacts after the commit so they can never
            # be mistaken for a published version.
            version="${crate_version}"
            tag="dev-${GITHUB_SHA::7}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Building ${tag} (version ${version})"

      - name: Select build matrix
        id: matrix
        shell: bash
        env:
          # A tag push always builds everything; only a manual run can narrow it.
          SELECTION: ${{ github.event_name == 'workflow_dispatch' && inputs.targets || 'all' }}
        run: |
          set -euo pipefail
          linux='{"os":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu","bundles":"deb,appimage"}'
          mac_intel='{"os":"macos-15-intel","target":"x86_64-apple-darwin","bundles":"app,dmg"}'
          mac_arm='{"os":"macos-15","target":"aarch64-apple-darwin","bundles":"app,dmg"}'
          windows='{"os":"windows-2025","target":"x86_64-pc-windows-msvc","bundles":"msi,nsis"}'
          case "${SELECTION}" in
            linux)   include="[${linux}]" ;;
            macos)   include="[${mac_intel},${mac_arm}]" ;;
            windows) include="[${windows}]" ;;
            *)       include="[${linux},${mac_intel},${mac_arm},${windows}]" ;;
          esac
          echo "matrix={\"include\":${include}}" >> "$GITHUB_OUTPUT"
          echo "Targets: ${SELECTION}"

  # ── web client ────────────────────────────────────────────────────────────
  web:
    name: web client
    # Gated on `plan` purely for cost: a tag/version mismatch should not also burn a full
    # wasm-pack + pnpm build in parallel before anyone sees the error.
    needs: [plan]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: web

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # web/src/wasm/ is gitignored (a build artifact), and web/src/islands/index.ts imports
      # `@/wasm/dam_viewer.js`, so vite cannot resolve it on a clean checkout without this.
      - name: Build WASM viewer islands
        run: cargo xtask wasm

      - name: Assert the islands were actually built
        shell: bash
        run: |
          set -euo pipefail
          test -f web/src/wasm/dam_viewer.js
          test -f web/src/wasm/dam_viewer_bg.wasm

      - name: Build web client
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Assert the client bundle exists
        shell: bash
        run: |
          set -euo pipefail
          test -f web/dist/index.html
          test -d web/dist/assets

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 1

  # ── per-target build, package, smoke test ─────────────────────────────────
  build:
    name: build (${{ matrix.target }})
    needs: [plan, web]
    runs-on: ${{ matrix.os }}
    # Every leg cmake-builds Assimp + Draco from source, so these are long. The cap is well
    # above a cold build but well below the 6-hour default, so a wedged step (a serve that
    # never dies, a bundler waiting on input) fails in an hour instead of billing for six.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      VERSION: ${{ needs.plan.outputs.version }}
      TARGET: ${{ matrix.target }}
      # The macOS images ship CMake 4.x while Linux/Windows are on 3.31. CMake 4 removed
      # compatibility with pre-3.5 minimums and flips a batch of policies to NEW; the vendored
      # Assimp tree declares minimums as low as 3.8 (openddlparser) and 3.10 (zlib), and
      # Assimp/Draco are a known casualty of that switch. Setting the floor is free on the
      # runners that don't need it, and cheaper than discovering it on a 10x-billed leg.
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Fetch the prebuilt web client
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      # dam-server embeds web/dist via rust-embed and degrades to a "bundle not present"
      # placeholder rather than failing the build, so an empty download would produce a
      # binary that looks fine until someone opens it.
      - name: Assert the client is present to embed
        shell: bash
        run: |
          set -euo pipefail
          test -f web/dist/index.html
          test -d web/dist/assets

      # GTK3 + WebKitGTK 4.1 for the Tauri shell (ADR 0013); librsvg2-dev is load-bearing for
      # the AppImage bundler's linuxdeploy gtk plugin, which aborts without librsvg-2.0.pc.
      # Deliberately no libasound2-dev: cpal is not in this dependency tree.
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev libssl-dev pkg-config

      - name: Build 3dam
        run: cargo build -p dam --release --locked --target ${{ matrix.target }}

      # Shell completions + man pages (ADR 0009 §10). They are rendered by *running the binary
      # this leg just built* (`3dam completions <shell>` / `3dam man`, hidden subcommands) rather
      # than by a build script, so the clap tree in dam-cli stays the only copy of the grammar and
      # what ships is by construction what this binary accepts. xtask invokes it through
      # `cargo run` with the same flags as the step above, so this is a cache hit, not a rebuild.
      #
      # Must precede both consumers: the portable archive carries the files, and the .deb installs
      # them from the same packaging/ dir named in tauri.conf.json — where the bundler treats a
      # missing source as a hard error. Note packaging/ is top-level, NOT under target/: the deb
      # config needs a literal path and `[build] target-dir` can move target/ anywhere.
      - name: Generate shell completions and man pages
        run: cargo xtask packaging --target ${{ matrix.target }}

      # Assert rather than glob, matching `Collect installers` below. These filenames are not ours
      # to choose — clap_complete picks them and the shells' completion loaders look them up by
      # name, so an upstream rename would otherwise ship a .deb whose completions silently never
      # load. `if-no-files-found: error` on the upload cannot catch it: the archive exists either
      # way, just with less in it.
      - name: Assert the packaging assets were generated
        shell: bash
        run: |
          set -euo pipefail
          for f in 3dam.bash _3dam 3dam.fish _3dam.ps1; do
            test -f "packaging/completions/${f}"
          done
          # xtask gzips the pages where `gzip` exists (Debian policy §12.1 wants them compressed
          # and the Tauri bundler compresses nothing itself). Only the .deb needs that, and only
          # Linux builds one — elsewhere the uncompressed page is fine, so require .gz on Linux
          # only rather than making the Windows leg depend on Git Bash's gzip being on PATH.
          if [[ "${RUNNER_OS}" == "Linux" ]]; then
            test -f packaging/man/3dam.1.gz
          fi
          # More than one page: clap_mangen recurses into subcommands, so a tree that rendered
          # only `3dam.1` would mean the graft in dam-cli's generate.rs stopped working.
          pages=$(find packaging/man -name '3dam*.1' -o -name '3dam*.1.gz' | wc -l)
          echo "staged ${pages} man pages"
          [[ "${pages}" -gt 1 ]]

      # NOTE: the portable archive MUST be cut before the Tauri bundler runs. The bundler
      # rewrites the built binary in place ("Patching … with bundle type information: deb"),
      # stamping a fixed-width token that `tauri::process` reads back at runtime. Since
      # tauri-bundler 2.9 it snapshots and restores the pristine binary afterwards — but only
      # on the success path, so a bundler run that fails partway leaves the stamp behind.
      # Verified locally: after a failed AppImage bundle the binary still read
      # `__TAURI_BUNDLE_TYPE_VAR_APP` instead of `…_UNK`. Archiving first means the portable
      # download can't inherit that.
      - name: Package portable archive
        shell: bash
        run: |
          set -euo pipefail
          # `if`, not `[[ … ]] && bin=…`: under `set -e` an AND-list that evaluates false is
          # fatal when it is the last statement in the script, so the short form only works by
          # accident of where it sits. Don't leave that for the next person reordering steps.
          bin=3dam
          if [[ "${RUNNER_OS}" == "Windows" ]]; then bin=3dam.exe; fi
          rm -rf dist && mkdir -p dist
          cp "target/${TARGET}/release/${bin}" "dist/${bin}"
          # Completions and man pages ride along in every portable archive, not just the .deb —
          # the archive is the only channel for macOS and Windows, and for anyone on Linux who
          # does not install the package (ADR 0009 §10). Same files on every platform: they are
          # plain text describing the command tree, not host-specific, and pruning per-OS would
          # cost more explaining than the few kB it saves.
          cp -R packaging/completions dist/completions
          cp -R packaging/man dist/man
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            (cd dist && 7z a -tzip "../3dam-${TAG}-${TARGET}.zip" "${bin}" completions man >/dev/null)
          else
            chmod +x "dist/${bin}"
            tar -czf "3dam-${TAG}-${TARGET}.tar.gz" -C dist "${bin}" completions man
          fi

      # The acceptance criterion for issue #45 is that each artifact actually launches on a
      # clean machine. A GitHub runner IS a clean machine, so run the check against the
      # unpacked archive rather than the build tree — that also proves the archive itself is
      # well-formed, not just the binary that went into it.
      - name: Smoke-test the packaged artifact
        shell: bash
        run: |
          set -euo pipefail
          bin=3dam
          if [[ "${RUNNER_OS}" == "Windows" ]]; then bin=3dam.exe; fi
          rm -rf smoke && mkdir -p smoke/unpacked smoke/data
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            7z x -osmoke/unpacked "3dam-${TAG}-${TARGET}.zip" >/dev/null
          else
            tar -xzf "3dam-${TAG}-${TARGET}.tar.gz" -C smoke/unpacked
          fi
          exe="./smoke/unpacked/${bin}"

          # 1. The CLI role answers, and ships the version this run claims to ship.
          got="$("${exe}" --version)"
          echo "reported: ${got}"
          [[ "${got}" == "3dam ${VERSION}" ]]

          # 2. The engine opens a fresh catalog — which runs every schema migration — and
          #    emits the JSON contract the CLI promises.
          "${exe}" --data smoke/data stats --json | grep -q '"total"'

          # 2b. The archive carries the completions and man pages, and the binary can still
          #     render them (they are generated, not compiled in, so a broken `completions`
          #     subcommand would otherwise only surface at the next release).
          test -f smoke/unpacked/completions/3dam.bash
          test -f smoke/unpacked/man/3dam.1 || test -f smoke/unpacked/man/3dam.1.gz
          "${exe}" completions bash | grep -q '3dam'

          # 3. The serve role binds, answers /healthz, and serves the *embedded* client.
          #    Grepping for `assets/` distinguishes the real bundle from dam-server's
          #    "web client bundle is not present" placeholder, which has no asset refs.
          #    Two reasons for the redirect + trap. Under `set -e` a failing assertion below
          #    would otherwise skip the kill and leave a server holding the runner open; and a
          #    background process inheriting the step's stdout keeps the step alive until that
          #    pipe closes, so it must be sent to a file and then actually reaped with `wait`
          #    (`3dam serve` drains connections for up to 10s after SIGTERM).
          "${exe}" serve --data smoke/data --addr 127.0.0.1:7878 > smoke/serve.log 2>&1 &
          server=$!
          trap 'kill "${server}" 2>/dev/null || true; wait "${server}" 2>/dev/null || true' EXIT
          ready=""
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:7878/healthz >/dev/null 2>&1; then ready=1; break; fi
            sleep 1
          done
          if [[ -z "${ready}" ]]; then
            echo "::error::serve never answered /healthz within 60s on ${TARGET}"
            cat smoke/serve.log || true
            exit 1
          fi
          index="$(curl -fsS http://127.0.0.1:7878/)"
          grep -qi '<!doctype html' <<<"${index}"
          grep -q 'assets/' <<<"${index}"
          echo "smoke test passed for ${TARGET}"

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall

      # Prebuilt, because `cargo install tauri-cli` compiles the whole cargo-mobile2 tree
      # (~10-15 min) and Swatinem/rust-cache does not cache ~/.cargo/bin, so it would be
      # paid again on every single run of every leg.
      # `--version` with an explicit requirement, rather than the `crate@^2` shorthand, which
      # binstall documents only for exact versions.
      - name: Install tauri-cli
        run: cargo binstall -y --locked --version '^2' tauri-cli

      # Run from the desktop crate; the CLI resolves the workspace target dir via
      # `cargo metadata`, so this writes to target/<triple>/release/bundle/ at the repo root.
      - name: Bundle native installers
        shell: bash
        run: |
          set -euo pipefail
          (cd crates/3dam-desktop && cargo tauri bundle --target "${TARGET}" --bundles "${{ matrix.bundles }}")

      # Driven off matrix.bundles so what we asked the bundler for and what we require it to
      # have produced cannot drift. Each format must yield EXACTLY one file: a `nullglob` loop
      # would treat "the bundler produced nothing" as success, the upload's
      # `if-no-files-found: error` would still be satisfied by the portable archive, and the
      # run would go green having shipped a release with no installers in it. More than one
      # match matters too — a multi-language WiX config emits one .msi per language, and a
      # blind `cp` loop would silently keep whichever sorted last.
      - name: Collect installers
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          out="target/${TARGET}/release/bundle"
          base="3dam-${TAG}-${TARGET}"

          collect() { # <bundle-dir> <glob> <destination>
            local dir="$1" pat="$2" dest="$3"
            local matches=("${out}/${dir}"/${pat})
            if [[ ${#matches[@]} -ne 1 ]]; then
              echo "::error::${dir}: expected exactly 1 ${pat}, found ${#matches[@]} in ${out}/${dir}"
              exit 1
            fi
            cp "${matches[0]}" "${dest}"
            echo "  ${matches[0]} -> ${dest}"
          }

          # `app` builds the .app that the .dmg wraps; only the .dmg is shipped.
          IFS=',' read -ra requested <<< "${{ matrix.bundles }}"
          for want in "${requested[@]}"; do
            case "${want}" in
              deb)      collect deb      '*.deb'      "${base}.deb" ;;
              appimage) collect appimage '*.AppImage' "${base}.AppImage" ;;
              dmg)      collect dmg      '*.dmg'      "${base}.dmg" ;;
              msi)      collect msi      '*.msi'      "${base}.msi" ;;
              # NSIS emits an installer .exe; name it so it cannot be mistaken for the binary.
              nsis)     collect nsis     '*.exe'      "${base}-setup.exe" ;;
              app)      ;;
              *)        echo "::error::unhandled bundle type '${want}'"; exit 1 ;;
            esac
          done
          ls -la "${base}"*

      # `error`, not `warn`: with `warn`, a leg that produced nothing still passes but creates
      # no artifact object at all, and `publish` then fails downloading it — a confusing
      # failure a long way from the cause.
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: 3dam-${{ needs.plan.outputs.tag }}-${{ matrix.target }}*
          if-no-files-found: error

  # ── publish ───────────────────────────────────────────────────────────────
  # `needs: [build]` means a failed leg blocks the release even with fail-fast disabled, so a
  # tag can never publish a partial set of platforms.
  publish:
    name: publish
    runs-on: ubuntu-latest
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(3dam-*)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "::error::no release artifacts were downloaded"
            exit 1
          fi
          sha256sum "${files[@]}" > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            3dam-*
            SHA256SUMS
          fail_on_unmatched_files: true
