# ============================================================================
# TEMPLATE — cross-platform release pipeline for 3DAM.
#
# Adapted from the sibling `mogen` project's release workflow. See
# docs/tech-spec/15-observability-config-testing-packaging.md §15.5
# ("Packaging & release") for the rationale and how 3DAM differs (single
# `3dam` binary; the React web client is built and embedded before
# `cargo build`; heavier native deps).
#
# This is a SCAFFOLD. It does NOT auto-run: the `push: tags` trigger is
# commented out so it can't fail on a tag before the `3dam` crate exists.
# Before enabling it:
#   1. Create the `3dam` binary crate (and `web/` client) — see PRODUCT_SPEC §9.
#   2. Confirm the crate/package name used in the `-p 3dam` flags below.
#   3. Add an app icon at `assets/icon.png` for the .ico/.icns/.dmg steps.
#   4. Add `[package.metadata.deb]` / `[package.metadata.wix]` as needed.
#   5. Uncomment the `push: tags` trigger.
# Items marked TODO are placeholders to confirm once the workspace lands.
# ============================================================================
name: release

on:
  # TODO: enable once the `3dam` crate builds. Until then, run manually via
  # the Actions tab (workflow_dispatch) to test.
  # push:
  #   tags:
  #     - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      # `@stable` (>= MSRV) is fine for release builds. MSRV drift is guarded by the
      # accurate `rust-version = "1.91"` in the workspace Cargo.toml: the resolver honors
      # it and fails fast on an older toolchain. We deliberately do NOT add a separate
      # `@1.91` MSRV-verification job — the tree compiles Assimp from source (cmake/C++),
      # so a dedicated MSRV build would be costly for little gain over the Cargo check.
      # When wiring real push-triggered CI, revisit whether a cheap `cargo +1.91 metadata`
      # (or `cargo check` on a lighter feature set) is worth adding here.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      # --- Web client (3DAM-specific) --------------------------------------
      # Build the React web UI and leave its static assets where the `3dam`
      # binary embeds them (e.g. web/dist via rust-embed) BEFORE cargo build.
      # Guarded so it no-ops until the web client exists.
      - name: Set up pnpm
        if: hashFiles('web/package.json') != ''
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node
        if: hashFiles('web/package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build web client
        if: hashFiles('web/package.json') != ''
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      # --- Native deps & build ---------------------------------------------
      # egui/eframe (GTK/xcb/wayland) + 3DAM's own: wgpu/Vulkan, audio (cpal),
      # and image/3D loaders. The headless-serve software rasteriser
      # (Mesa lavapipe/llvmpipe) is a runtime concern, not a build dep.
      - name: Install Linux deps
        if: runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: >-
            libgtk-3-dev libxkbcommon-dev libwayland-dev
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb1-dev
            libasound2-dev libssl-dev pkg-config
          version: 1.0

      - name: Build 3dam
        run: cargo build -p 3dam --release --locked --target ${{ matrix.target }}

      # --- Packaging --------------------------------------------------------
      - name: Package (unix tarball)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          target="${{ matrix.target }}"
          out="3dam-${tag}-${target}.tar.gz"

          rm -rf dist
          mkdir -p dist
          cp "target/${target}/release/3dam" dist/3dam
          chmod +x dist/3dam
          tar -czf "${out}" -C dist 3dam

      - name: Package (windows zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $target = "${{ matrix.target }}"
          $out = "3dam-$tag-$target.zip"

          if (Test-Path dist) { Remove-Item -Recurse -Force dist }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/$target/release/3dam.exe" "dist/3dam.exe"
          Push-Location dist
          Compress-Archive -Path "3dam.exe" -DestinationPath "../$out" -Force
          Pop-Location

      - name: Install cargo-deb
        if: runner.os == 'Linux'
        run: cargo install cargo-deb --version 3.7.0 --locked

      - name: Package .deb (linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          target="${{ matrix.target }}"
          cargo deb -p 3dam --no-build --target "${target}"
          src=$(ls "target/${target}/debian"/*.deb | head -n1)
          cp "${src}" "3dam-${tag}-${target}.deb"

      - name: Install cargo-wix
        if: runner.os == 'Windows'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-wix

      - name: Generate Windows app icon (.ico)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $target = "${{ matrix.target }}"
          magick assets/icon.png `
            -define icon:auto-resize=256,128,64,48,32,24,16 `
            "target/$target/release/AppIcon.ico"

      - name: Package .msi (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $target = "${{ matrix.target }}"
          $out = "3dam-$tag-$target.msi"
          cargo wix -p 3dam --no-build --nocapture --target $target --output $out

      - name: Package .dmg (macos)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          target="${{ matrix.target }}"
          version="${tag#v}"
          app="3DAM.app"

          rm -rf "${app}" dmg-staging
          mkdir -p "${app}/Contents/MacOS" "${app}/Contents/Resources"
          cp "target/${target}/release/3dam" "${app}/Contents/MacOS/3dam"
          chmod +x "${app}/Contents/MacOS/3dam"

          iconset="AppIcon.iconset"
          rm -rf "${iconset}"
          mkdir -p "${iconset}"
          sips -z 16   16   assets/icon.png --out "${iconset}/icon_16x16.png"     >/dev/null
          sips -z 32   32   assets/icon.png --out "${iconset}/icon_16x16@2x.png"  >/dev/null
          sips -z 32   32   assets/icon.png --out "${iconset}/icon_32x32.png"     >/dev/null
          sips -z 64   64   assets/icon.png --out "${iconset}/icon_32x32@2x.png"  >/dev/null
          sips -z 128  128  assets/icon.png --out "${iconset}/icon_128x128.png"   >/dev/null
          sips -z 256  256  assets/icon.png --out "${iconset}/icon_128x128@2x.png">/dev/null
          sips -z 256  256  assets/icon.png --out "${iconset}/icon_256x256.png"   >/dev/null
          sips -z 512  512  assets/icon.png --out "${iconset}/icon_256x256@2x.png">/dev/null
          cp assets/icon.png "${iconset}/icon_512x512.png"
          iconutil -c icns "${iconset}" -o "${app}/Contents/Resources/AppIcon.icns"

          cat > "${app}/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>3DAM</string>
            <key>CFBundleDisplayName</key><string>3DAM</string>
            <key>CFBundleIdentifier</key><string>com.cattrall.threedam</string>
            <key>CFBundleVersion</key><string>${version}</string>
            <key>CFBundleShortVersionString</key><string>${version}</string>
            <key>CFBundleExecutable</key><string>3dam</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSMinimumSystemVersion</key><string>10.13</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST

          mkdir dmg-staging
          mv "${app}" "dmg-staging/${app}"
          ln -s /Applications dmg-staging/Applications

          out="3dam-${tag}-${target}.dmg"
          hdiutil create \
            -volname "3DAM" \
            -srcfolder dmg-staging \
            -ov -format UDZO \
            "${out}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            3dam-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
            3dam-${{ github.ref_name }}-${{ matrix.target }}.zip
            3dam-${{ github.ref_name }}-${{ matrix.target }}.deb
            3dam-${{ github.ref_name }}-${{ matrix.target }}.msi
            3dam-${{ github.ref_name }}-${{ matrix.target }}.dmg
          if-no-files-found: warn

  publish:
    name: publish
    runs-on: ubuntu-latest
    needs: [build]
    # Only publish a GitHub Release for real tag pushes, never for manual
    # workflow_dispatch test runs.
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          rm -f SHA256SUMS
          shopt -s nullglob
          for f in 3dam-*.tar.gz 3dam-*.zip 3dam-*.deb 3dam-*.msi 3dam-*.dmg; do
            sha256sum "$f" >> SHA256SUMS
          done
          if [[ ! -s SHA256SUMS ]]; then
            echo "No release archives found to checksum" >&2
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            3dam-*.tar.gz
            3dam-*.zip
            3dam-*.deb
            3dam-*.msi
            3dam-*.dmg
            SHA256SUMS
